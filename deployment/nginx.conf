# Milliy Narx - Contabo VPS Production Nginx Configuration
# Reverse proxy routing frontend to Vite dist and /api to FastAPI

upstream fastapi_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name milliy-narx.uz www.milliy-narx.uz;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name milliy-narx.uz www.milliy-narx.uz;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/milliy-narx.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/milliy-narx.uz/privkey.pem;
    
    # Modern TLS Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root Directory for Vite React Production Build
    root /var/www/milliynarx/frontend/dist;
    index index.html;

    # API Reverse Proxy -> FastAPI
    location /api/ {
        proxy_pass http://fastapi_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for AI analysis & heavy aggregation
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploads Storage (Contabo VPS local server storage)
    location /uploads/ {
        alias /var/www/milliynarx/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Vite SPA Frontend Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Logs
    access_log /var/log/nginx/milliynarx_access.log;
    error_log /var/log/nginx/milliynarx_error.log;
}
