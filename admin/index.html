    <!-- Theme Initialization: Checks localStorage for admin preference -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('milliynarx_admin_theme');
          if (pref === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#090D16] text-slate-900 dark:text-slate-100 font-sans antialiased overflow-x-hidden min-h-screen">

    <script type="module" src="/src/main.jsx"></script>
  </body>
